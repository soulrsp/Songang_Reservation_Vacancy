name: 🎾 송강실내테니스장 3분 간격 실시간 취소표 알리미 (GitHub Actions Cron)

on:
  schedule:
    # Public 레포지토리 전용: 100% 무제한 무료 실행
    # 한국 시간(KST) 06:00 ~ 24:00 동안 3분 간격 자동 감지 (UTC 기준 21:00~14:59)
    - cron: '*/3 21-23,0-14 * * *'
  workflow_dispatch:

jobs:
  check-tennis-vacancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Setup mcporter
        run: |
          npm ci
          npm install -g mcporter
          mcporter config add mcp-gateway https://playmcp.kakao.com/mcp --auth oauth --scope home
          mkdir -p ~/.mcporter
          node -e '
            const fs = require("fs");
            const os = require("os");
            const path = require("path");
            const axios = require("axios");

            async function initCreds() {
              const rawToken = (process.env.KAKAO_ACCESS_TOKEN || "").trim();
              if (!rawToken) {
                console.warn("[GitHub Setup] ⚠️ KAKAO_ACCESS_TOKEN is empty in GitHub Secrets!");
                return;
              }

              let accessToken = rawToken;
              let refreshToken = rawToken;

              try {
                // If rawToken is OTT (64-char hex)
                if (rawToken.length === 64 && !rawToken.includes(".")) {
                  console.log("[GitHub Setup] Exchanging OTT for PlayMCP OAuth tokens...");
                  const exRes = await axios.post("https://playmcp.kakao.com/api/v1/auths/otts:exchange", { tokenValue: rawToken });
                  if (exRes.data && exRes.data.accessToken) {
                    accessToken = exRes.data.accessToken.tokenValue;
                    refreshToken = exRes.data.refreshToken ? exRes.data.refreshToken.tokenValue : rawToken;
                  }
                } else {
                  // Try OAuth refresh token endpoint
                  try {
                    const params = new URLSearchParams({
                      grant_type: "refresh_token",
                      client_id: "HElMUWdVoroTsrXxezeTSemg8gXzzCKWARb5MJux8gY",
                      refresh_token: rawToken
                    });
                    const rfRes = await axios.post("https://playauth.kakao.com/playmcp/oauth2/token", params.toString(), {
                      headers: { "Content-Type": "application/x-www-form-urlencoded" }
                    });
                    if (rfRes.data && rfRes.data.access_token) {
                      accessToken = rfRes.data.access_token;
                      refreshToken = rfRes.data.refresh_token || rawToken;
                    }
                  } catch (e) {}
                }

                const hash = "92ef5a9fd655a681";
                const credsPath = path.join(os.homedir(), ".mcporter", "credentials.json");
                const creds = {
                  version: 2,
                  entries: {
                    ["mcp-gateway|" + hash]: {
                      serverName: "mcp-gateway",
                      serverUrl: "https://playmcp.kakao.com/mcp",
                      tokens: {
                        access_token: accessToken,
                        refresh_token: refreshToken,
                        token_type: "Bearer",
                        expires_in: 43199,
                        scope: "default",
                        issuer: "https://playauth.kakao.com/playmcp",
                        expires_at: Math.floor(Date.now() / 1000) + 43199
                      },
                      clientInfo: {
                        client_id: "HElMUWdVoroTsrXxezeTSemg8gXzzCKWARb5MJux8gY",
                        issuer: "https://playauth.kakao.com/playmcp"
                      },
                      updatedAt: new Date().toISOString(),
                      authorizationServerUrl: "https://playauth.kakao.com/playmcp",
                      resourceUrl: "https://playmcp.kakao.com/mcp"
                    }
                  },
                  serverUrls: {
                    "mcp-gateway": "https://playmcp.kakao.com/mcp"
                  }
                };

                fs.writeFileSync(credsPath, JSON.stringify(creds, null, 2));
                console.log("[GitHub Setup] ✅ mcporter PlayMCP gateway credentials initialized successfully!");
              } catch (err) {
                console.error("[GitHub Setup] Token setup notice:", err.message);
              }
            }

            initCreds();
          '
        env:
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}

      - name: Run Songgang Tennis 3-Min Vacancy Monitor Agent
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
        run: node server/index.js --cron-once
