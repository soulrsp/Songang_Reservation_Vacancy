name: 🎾 송강실내테니스장 실시간 취소표 알리미

on:
  schedule:
    # KST 06:00~24:00 동안 3분 간격 (UTC 21:00~14:59)
    - cron: '*/3 21-23,0-14 * * *'
  workflow_dispatch:

jobs:
  check-vacancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: server/state
          key: songgang-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            songgang-state-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Run Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server/index.js

      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: server/state
          key: songgang-state-${{ runner.os }}-${{ github.run_id }}
